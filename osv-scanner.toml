# osv-scanner runs against pnpm-lock.yaml. Unlike duraflows, this repo DOES ship real third-party
# runtime dependencies to consumers: `avsc` (@werken/avro-codec) and `pg`/`kysely`
# (@werken/idempotency-postgres). `@google-cloud/pubsub`, `@nestjs/*` and `@opentelemetry/api` are
# peerDependencies and so belong to the consumer's tree.
#
# Because this library sits under every event consumer in the company, advisories against those
# runtime deps must NOT be suppressed — a blanket `ecosystem = "npm"` ignore (as used in duraflows,
# where the runtime tree is a single first-party leaf) would be wrong here.
#
# The known pain point is that osv-scanner cannot classify pnpm (lockfileVersion 9) TRANSITIVE dev
# dependencies as "dev", so dev-tooling advisories surface as CI failures despite never reaching
# consumers. Handle those by adding narrow, dated, per-advisory ignores below rather than by
# ignoring the ecosystem wholesale.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "dev-only transitive (vite -> ...); not reachable from published packages"

# GHSA-8988-4f7v-96qf (CVE-2026-54285) — @opentelemetry/core < 2.8.0. The W3C Baggage propagator
# applies no size ceiling when EXTRACTING a `baggage` header, so an oversized one allocates memory
# proportional to its size (CWE-770; availability only; CVSS 5.3).
#
# Suppressed deliberately, and this is neither dev-only nor a dependency we ship:
#
#  1. There is no fix to take. @google-cloud/pubsub 5.3.1 is the latest release and depends on
#     `@opentelemetry/core: ^1.30.1`. 1.30.1 is the highest 1.x, and the fix landed only in 2.8.0.
#  2. It is not ours to ship. It arrives through @google-cloud/pubsub, a peerDependency, so it sits
#     in the consumer's tree where their own audit surfaces it. A pnpm override would turn this job
#     green without changing a single consumer install — security theatre, and it would also force
#     a major on the SDK against its declared range.
#  3. The vulnerable path is unreachable from this library. Werken never propagates baggage: the
#     only carrier handed to `propagation.extract` holds `traceparent` and `tracestate`, read from
#     Pub/Sub attributes. The advisory's messaging-transport caveat is about code that extracts
#     baggage over a non-HTTP transport, which this does not do.
#
# Revisit when @google-cloud/pubsub moves to @opentelemetry/core 2.x.
[[IgnoredVulns]]
id = "GHSA-8988-4f7v-96qf"
ignoreUntil = 2026-11-30
reason = "No upstream fix available: @google-cloud/pubsub 5.3.1 (latest) pins @opentelemetry/core ^1.30.1, patched only in 2.8.0. Reaches this repo through a peerDependency, and werken never extracts baggage, so the vulnerable propagator path is unreachable here."

# GHSA-m8vh-jmq9-5rjg — @nestjs/microservices < 11.2.4: a deeply nested microservice message
# pattern can terminate the process. GHSA-96h4-vgxj-gvm2 — @nestjs/microservices < 11.2.5:
# unbounded memory growth in the TCP microservice transport.
#
# Suppressed deliberately while the maintainer holds the NestJS upgrade:
#
#  1. The 11.1.28 in pnpm-lock.yaml is this repo's dev/test copy (root devDependency, and what
#     the workspace resolves for the peer). It is not shipped.
#  2. @werken/nestjs-google-pubsub declares `@nestjs/microservices: ^11.0.0` as a peerDependency,
#     so consumers resolve their own copy, and that range admits the patched >=11.2.5.
#
# Revisit when the NestJS hold is lifted; moving the dev copy to >=11.2.5 clears both.
[[IgnoredVulns]]
id = "GHSA-m8vh-jmq9-5rjg"
ignoreUntil = 2027-01-31
reason = "NestJS upgrade deliberately held by the maintainer. werken declares the peer @nestjs/microservices ^11.0.0, so consumers resolve their own copy and can take the patched >=11.2.5; this repo's 11.1.28 is only a dev/test copy."

[[IgnoredVulns]]
id = "GHSA-96h4-vgxj-gvm2"
ignoreUntil = 2027-01-31
reason = "NestJS upgrade deliberately held by the maintainer. werken declares the peer @nestjs/microservices ^11.0.0, so consumers resolve their own copy and can take the patched >=11.2.5; this repo's 11.1.28 is only a dev/test copy."

# GHSA-c475-qrg2-pj4r — basic-ftp < 6.2.1: quadratic-time CPU denial of service in the
# Client.list() Unix directory-listing parser.
#
# Dev-only and not reachable from either published package: release-it -> proxy-agent 8.0.2 ->
# pac-proxy-agent 9.1.0 -> get-uri 8.0.1, which requires basic-ftp ^5.3.1. Every link in that
# chain is already its latest release, and the fix exists only in basic-ftp 6.x.
#
# Revisit when get-uri (or proxy-agent) moves to basic-ftp 6.x.
[[IgnoredVulns]]
id = "GHSA-c475-qrg2-pj4r"
ignoreUntil = 2027-01-31
reason = "Dev-only transitive via release-it -> proxy-agent -> pac-proxy-agent -> get-uri 8.0.1, which requires basic-ftp ^5.3.1; the fix exists only in 6.x and no upstream release in that chain has moved. Not part of either published package."
