packages:
  - "packages/*"
  - "examples/*"

# pnpm 11 no longer reads the `pnpm` field in package.json — these settings live here now.
# See https://pnpm.io/settings
linkWorkspacePackages: true

# Dependencies permitted to run install scripts. pnpm 11 fails the install outright when a package
# with a build script is neither allowed nor explicitly refused, so every one has to be named here.
#
# This replaces the legacy `onlyBuiltDependencies` list, which pnpm 11 parses but no longer honours
# for build approval — lefthook was listed there and was still reported as ignored, which failed
# `pnpm install --frozen-lockfile` in CI on every job.
#
#  - lefthook: its postinstall fetches the platform binary. Without it the git hooks silently stop
#    running, taking the local quality gates with them.
#  - protobufjs: transitive, via @google-cloud/pubsub. Allowed rather than refused because it is
#    part of the SDK's own wire encoding; set it to false to block the script if that is preferred.
#  - @nestjs/core: not installed by a normal build. The nest-next canary adds the Nest 12
#    prereleases, and those carry a build script; without an entry here that job dies at install
#    and the early warning it exists to give never runs.
allowBuilds:
  lefthook: true
  protobufjs: true
  "@nestjs/core": true

overrides:
  brace-expansion: ^5.0.6
  fast-uri: ^3.1.2
  js-yaml: ^4.2.0
  # Transitive, dev-only: postcss -> vite -> vitest. GHSA-2v37-7h3g-55p8 (CVSS 8.2) is fixed in
  # 3.3.17, and postcss still floats to the 3.x range, so nothing upstream forces the bump.
  nanoid: ^3.3.17
  typescript: ^5.9.3
  undici: ">=8.5.0"
