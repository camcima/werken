name: CI

# Least privilege by default. A job that needs more grants it explicitly, as osv-scanner does.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 11.18.0
  # Version used by jobs that only need one. Must appear in the matrices below.
  PRIMARY_NODE_VERSION: "22"

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines declares >=22; both supported majors are proven on every PR rather than assumed.
        node-version: ["22", "24"]
    name: ci (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      # Acceptance criteria 11 and 13 (§9). Also enforced pre-commit via lefthook.
      - run: pnpm run lint:no-deep-imports
      - run: pnpm run lint:neutrality
      - run: pnpm run lint:dead-code
      - run: pnpm run test:coverage
      # Uploaded from one leg only. The matrix legs produce identical coverage, so uploading both
      # just adds noise to the Codecov report.
      - uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        if: matrix.node-version == env.PRIMARY_NODE_VERSION
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          flags: unit
          fail_ci_if_error: true

  # Exercised against the Pub/Sub emulator (which supports schemas) and a real Postgres. No GCP
  # project, credentials or spend required.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    name: integration (node ${{ matrix.node-version }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: werken_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Start Pub/Sub emulator
        run: |
          docker run -d --name pubsub-emu -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --project=werken-ci --host-port=0.0.0.0:8085
          timeout 120 bash -c 'until curl -s -o /dev/null http://localhost:8085/v1/projects/werken-ci/topics; do sleep 2; done'
      - run: pnpm install --frozen-lockfile
      # The SIGTERM drain test spawns a real child process against the built package, so the
      # integration suite needs dist/ present. That path is also the most Node-version-sensitive
      # thing here, which is why integration is matrixed too rather than pinned to one major.
      - run: pnpm run build
      - run: pnpm vitest run --coverage --config vitest.integration.config.ts
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
          PUBSUB_PROJECT_ID: werken-ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/werken_test
          # Turns a skipped integration test into a failure. Without it, an emulator that failed to
          # start would skip all seven files and still report success, indistinguishable from a
          # healthy run because the unit job legitimately skips the same files.
          WERKEN_REQUIRE_INTEGRATION: "1"
      # Uploaded under its own flag so the project total is the union of both suites. Without this
      # half, code reachable only against a real broker or database — the default client, the SQL
      # store — counts as uncovered, and the reported number cannot distinguish "tested in the
      # integration job" from "tested nowhere". One leg only, as above.
      - uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        if: matrix.node-version == env.PRIMARY_NODE_VERSION
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          flags: integration
          fail_ci_if_error: true

  # Nest 12 readiness. Non-blocking by design: it warns us before Nest 12 lands, without
  # gating merges on an upstream prerelease. One Node version is enough for a compatibility canary.
  nest-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D -w @nestjs/common@next @nestjs/core@next @nestjs/microservices@next
      - run: pnpm run build
      - run: pnpm run test

  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            .
