# Werken — local backends for the integration suite.
#
#   docker compose up -d      # start the Pub/Sub emulator and Postgres
#   pnpm run test:integration # run the suite against them
#   docker compose down       # stop them
#
# Images and settings mirror .github/workflows/ci.yml so a local run and CI agree. No GCP project
# or credentials are needed: the emulator supports schemas, which is the only reason the schema
# tests can run without a real Pub/Sub.

services:
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=werken-dev --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      # The emulator serves the REST API as soon as it is ready; listing topics needs no auth.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8085/v1/projects/werken-dev/topics || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: werken_test
    ports:
      # Deliberately not 5432: a developer machine very often already runs Postgres there, and the
      # collision is silent — the container simply does not publish, and tests then talk to the
      # host's database instead, failing with "database werken_test does not exist".
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d werken_test"]
      interval: 5s
      timeout: 5s
      retries: 10
